  <g id="text_21">
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #234351" x="53.5896" y="59.558609" transform="rotate(-0 53.5896 59.558609)">04 / Где компоновка пока не проходит</text>
  </g>
  <g id="text_22">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677780" x="53.5896" y="79.058542" transform="rotate(-0 53.5896 79.058542)">Результат теста: геометрия основных агрегатов разложена, полного подтверждения помещаемости и сервиса пока нет.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #bd4750" x="53.5896" y="387.33135" transform="rotate(-0 53.5896 387.33135)">ПРЯМОУГОЛЬНИКИ, КОТОРЫМ ЕЩЁ НУЖНО МЕСТО</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="53.5896" y="613.77835" transform="rotate(-0 53.5896 613.77835)">HP — обязательная гидравлическая функция не помещена. FIRE/SAN/TANK — вынесенные функции с незаданным местом; HEAT — условная опция.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #bd4750" x="53.5896" y="652.242622" transform="rotate(-0 53.5896 652.242622)">Демонтаж двигателя: нужен отдельный съёмный люк ориентировочно ≥1,60 × 1,10 м и расчёт подъёма. Дверь 0,75 м для двигателя не годится.</text>
  </g>
  <g id="text_26">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="53.5896" y="689.52955" transform="rotate(-0 53.5896 689.52955)">Для расширенного МО оболочка проверяется отдельно. Снаружи проход смещается к борту: его пайол/ступени/потолок и связь с нижним камбузом не решены.</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="53.5896" y="727.234056" transform="rotate(-0 53.5896 727.234056)">Нельзя назначать новые полы из старых 1,47 м: сначала устраняем сервисные пересечения, размещаем гидропривод и трассы, затем увязываем уровни.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="53.5896" y="765.28075" transform="rotate(-0 53.5896 765.28075)">RO / EX3 пересекают сервис G1; доступ к редуктору между кормовыми узлами и валом требует отдельной проверки. Эти объёмы не спрятаны в площади агрегатов.</text>
  </g>
  <g id="text_29">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #677780" x="53.5896" y="802.985256" transform="rotate(-0 53.5896 802.985256)">Предел проверки: прямоугольные корпуса и проектные зоны подхода. Не нормативный минимум, не расчёт прочности, не монтажный чертёж.</text>
  </g>
 </g>
